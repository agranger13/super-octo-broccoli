; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Réglages communs aux cartes ESP32-S3
[esp32s3_common]
platform = espressif32
framework =
	arduino
build_unflags =
	-DARDUINO_USB_MODE=1
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=0
lib_deps =
	adafruit/Adafruit MPU6050@^2.2.6
	adafruit/Adafruit BusIO@^1.14.0

; Seeed XIAO ESP32-S3 : brochage défini dans include/BoardPins.h
; (sélection via la macro ARDUINO_XIAO_ESP32S3 fournie par la variante)
[env:xiao-esp32s3]
extends = esp32s3_common
board = seeed_xiao_esp32s3

[env:firebeetle-esps3]
extends = esp32s3_common
board = dfrobot_firebeetle2_esp32s3

; Environnement de test natif (PC)
[env:native]
platform = native
test_framework = unity
build_src_filter = +<motor/PIDController.cpp>
